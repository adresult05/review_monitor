name: Streamlit Keep Alive (Selenium)

on:
  schedule:
    - cron: '0 */3 * * *'  # 3시간마다 실행
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install selenium webdriver-manager

      - name: Run Python Bot
        run: |
          python -c "
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          from webdriver_manager.chrome import ChromeDriverManager
          import time

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--disable-gpu')
          options.add_argument('--disable-features=NetworkServiceInProcess2,DnsOverHttps')
          options.add_argument('--dns-prefetch-disable')
          options.add_argument('user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36')

          service = Service(ChromeDriverManager().install())
          driver = webdriver.Chrome(service=service, options=options)
          driver.set_page_load_timeout(60)

          try:
              print('스트림릿 앱 접속 시작...')
              for attempt in range(3):
                  try:
                      driver.get('https://reviewmonitor1.streamlit.app/')
                      break
                  except Exception as e:
                      print(f'{attempt+1}번째 시도 실패: {e}')
                      time.sleep(5)
              else:
                  raise Exception('3번 다 실패')
              time.sleep(5)
              try:
                  wake_button = WebDriverWait(driver, 10).until(
                      EC.element_to_be_clickable((By.XPATH, \"//button[contains(., 'get this app back up')]\"))
                  )
                  wake_button.click()
                  print('앱이 잠들어 있어서 깨우기 버튼을 클릭했습니다.')
                  time.sleep(15)
              except Exception:
                  print('이미 깨어 있는 상태였습니다 (버튼 없음).')
              print('완료.')
          finally:
              driver.quit()
          "
