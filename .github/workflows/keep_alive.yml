name: Streamlit Keep Alive

on:
  schedule:
    - cron: '0 */6 * * *'  # 6시간마다 실행
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 방법 1: 빈 커밋으로 잠자기 타이머 리셋 (Streamlit 공식 문서 방식, 훨씬 안정적) ──
      - name: 빈 커밋으로 슬립 타이머 리셋
        run: |
          git config user.name "keep-alive-bot"
          git config user.email "actions@github.com"
          mkdir -p .keepalive
          date -u +"%Y-%m-%d %H:%M:%S UTC" > .keepalive/last_ping.txt
          git add .keepalive/last_ping.txt
          git commit -m "chore: keep-alive ping" || echo "변경사항 없음, 커밋 생략"
          git push || echo "푸시할 내용 없음"

      # ── 방법 2: Selenium으로 실제 '깨우기' 버튼 클릭 (이미 잠들어 있는 경우 대비) ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install selenium webdriver-manager

      - name: Run Python Bot
        run: |
          python -c "
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          from webdriver_manager.chrome import ChromeDriverManager
          import time

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--disable-gpu')
          options.add_argument('user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36')

          service = Service(ChromeDriverManager().install())
          driver = webdriver.Chrome(service=service, options=options)
          driver.set_page_load_timeout(60)

          try:
              print('스트림릿 앱 접속 시작...')
              ok = False
              for attempt in range(3):
                  try:
                      driver.get('https://reviewmonitor1.streamlit.app/')
                      ok = True
                      break
                  except Exception as e:
                      print(f'{attempt+1}번째 시도 실패: {e}')
                      time.sleep(10)
              if not ok:
                  print('Selenium 접속 3번 다 실패 - 위 커밋 방식만으로 진행됨')
              else:
                  time.sleep(5)
                  try:
                      wake_button = WebDriverWait(driver, 10).until(
                          EC.element_to_be_clickable((By.XPATH, \"//button[contains(., 'get this app back up')]\"))
                      )
                      wake_button.click()
                      print('앱이 잠들어 있어서 깨우기 버튼을 클릭했습니다.')
                      time.sleep(15)
                  except Exception:
                      print('이미 깨어 있는 상태였습니다 (버튼 없음).')
              print('완료.')
          finally:
              driver.quit()
          "
        continue-on-error: true  # Selenium이 실패해도 워크플로 전체는 성공으로 처리 (커밋 방식이 이미 됐으므로)
